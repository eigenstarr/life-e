<style>
/* Layout: app shell, quiet graphite chrome, one rich moment (the day strip), golf-scorecard week view */
:root {
  --bg: #fafafa; --side: #f4f4f5; --card: #ffffff; --raised: #f4f4f5;
  --text: #171717; --text-2: #525252; --muted: #6f6f73;
  --line: rgba(23, 23, 23, 0.08); --line-2: rgba(23, 23, 23, 0.14);
  --accent: #1f7a4a; --on-accent: #ffffff;
  --pos: #16a34a; --neg: #dc2626;
  --c-school: #b4b4ba; --c-routine: #e1e1e5; --c-gym: #c2563a; --c-golf: #2f8a57;
  --c-sat: #3a5fc8; --c-cardio: #b0476e; --c-work: #c48a14; --c-free: #c9b48c; --c-sleep: #3f3f46;
  --seg-ink: #ffffff; --seg-ink-soft: #3f3f46;
  --accent-soft: rgba(31, 122, 74, 0.12); --map: #dcdce0; --map-head: #e8e8eb;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141415; --side: #0f0f10; --card: #19191b; --raised: #232325;
    --text: #ededed; --text-2: #a1a1a6; --muted: #85858b;
    --line: rgba(237, 237, 237, 0.08); --line-2: rgba(237, 237, 237, 0.14);
    --accent: #4cb07a; --on-accent: #0f0f10; --pos: #4cc38a; --neg: #e5484d;
    --c-school: #55555c; --c-routine: #313135; --c-gym: #df7353; --c-golf: #4cb07a;
    --c-sat: #7393f2; --c-cardio: #e07aa0; --c-work: #e2ac42; --c-free: #bfa97f; --c-sleep: #232326;
    --seg-ink: #0f0f10; --seg-ink-soft: #d4d4d8;
    --accent-soft: rgba(76, 176, 122, 0.16); --map: #36363a; --map-head: #2a2a2d;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141415; --side: #0f0f10; --card: #19191b; --raised: #232325;
  --text: #ededed; --text-2: #a1a1a6; --muted: #85858b;
  --line: rgba(237, 237, 237, 0.08); --line-2: rgba(237, 237, 237, 0.14);
  --accent: #4cb07a; --on-accent: #0f0f10; --pos: #4cc38a; --neg: #e5484d;
  --c-school: #55555c; --c-routine: #313135; --c-gym: #df7353; --c-golf: #4cb07a;
  --c-sat: #7393f2; --c-cardio: #e07aa0; --c-work: #e2ac42; --c-free: #bfa97f; --c-sleep: #232326;
  --seg-ink: #0f0f10; --seg-ink-soft: #d4d4d8;
    --accent-soft: rgba(76, 176, 122, 0.16); --map: #36363a; --map-head: #2a2a2d;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 20px;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Shell */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {
  background: var(--side); border-right: 1px solid var(--line);
  padding: 20px 16px; display: flex; flex-direction: column; gap: 24px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; }
.brand b { font-size: 17px; font-weight: 600; line-height: 1; }
.brand span { color: var(--muted); font-size: 12px; }
.nav-label { color: var(--muted); font-size: 12px; padding: 0 8px; margin-bottom: 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px;
  border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 500;
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.nav a svg { color: var(--muted); }
.nav a:hover { background: var(--raised); color: var(--text); }
.nav a[aria-current="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 8px; color: var(--muted); font-size: 12px; line-height: 16px; }
.side-foot div { display: flex; align-items: center; gap: 8px; }

.main {
  padding-block: 32px 64px;
  padding-left: max(32px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 32px; line-height: 1.15; font-weight: 500; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 .yr { color: var(--muted); }
.sub { color: var(--text-2); margin-top: 8px; }
.top-right { display: flex; align-items: center; gap: 12px; }
.theme-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px;
  font: inherit; font-weight: 500; color: var(--text-2); background: var(--raised); border: 1px solid var(--line); cursor: pointer;
  transition: border-color 150ms var(--ease), color 150ms var(--ease);
}
.theme-btn:hover { color: var(--text); border-color: var(--line-2); }
.clock { font-family: var(--mono); color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }

h2 { font-size: 15px; font-weight: 500; margin: 0; line-height: 20px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow); padding: 24px; min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.meta { color: var(--muted); font-size: 12px; line-height: 16px; font-family: var(--mono); }

/* Summary row */
.summary { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 2fr); gap: 16px; }
.now { display: flex; flex-direction: column; gap: 16px; }
.now-label { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
.now-title { font-size: 24px; line-height: 30px; font-weight: 500; text-wrap: balance; }
.bar { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transform-origin: left; }
.now-foot { display: flex; justify-content: space-between; gap: 12px; color: var(--text-2); flex-wrap: wrap; }
.now-next { padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; color: var(--text-2); }
.now-next b { color: var(--text); font-weight: 500; }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stat { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.stat .lab { color: var(--text-2); }
.stat .fig { font-size: 30px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .fig small { font-size: 15px; color: var(--muted); font-weight: 400; }
.stat .chg { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted); }
.stat .chg.ok { color: var(--pos); }

/* Day strip — the moment */
.tabs { display: flex; gap: 2px; padding: 2px; background: var(--raised); border-radius: 10px; overflow-x: auto; max-width: 100%; }
.tabs button {
  font: inherit; font-weight: 500; color: var(--text-2); background: transparent; border: 0;
  height: 30px; padding: 0 12px; border-radius: 8px; cursor: pointer; position: relative;
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); }
.tabs button .today-mark { position: absolute; left: 50%; bottom: 3px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--accent); }

.strip-wrap { position: relative; padding-top: 28px; }
.strip { position: relative; height: 56px; border-radius: 10px; overflow: hidden; background: var(--raised); }
.seg {
  position: absolute; top: 0; bottom: 0; background: var(--c);
  border-right: 2px solid var(--card);
  display: flex; align-items: center; padding: 0 8px; overflow: hidden;
  font-size: 12px; font-weight: 500; color: var(--seg-ink); white-space: nowrap;
}
.seg.soft { color: var(--seg-ink-soft); }
.seg.done::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,0.18) 5px 6px); }
.seg.past:not(.done) { opacity: 0.55; }
.axis { position: relative; height: 20px; margin-top: 8px; }
.axis span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.pin { position: absolute; top: 4px; bottom: 28px; width: 0; border-left: 1.5px solid var(--text); pointer-events: none; }
.pin svg { position: absolute; top: -2px; left: -1px; width: 14px; height: 12px; }
.pin svg path { fill: var(--text); }
.pin .t { position: absolute; top: -2px; left: 16px; font-family: var(--mono); font-size: 11px; line-height: 12px; color: var(--text); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; color: var(--text-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.blocks { margin-top: 24px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.row {
  display: grid; grid-template-columns: 112px 8px minmax(0, 1fr) 20px; align-items: center; gap: 12px;
  min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--line);
}
.row .tm { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .lb { min-width: 0; }
.row.cur .lb { font-weight: 500; }
.row.cur .tm { color: var(--accent); }
.row.done .lb { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.note { margin-top: 16px; color: var(--muted); font-size: 13px; }

/* Training + SAT */
.pair { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.focus { color: var(--text-2); margin: 0 0 20px; }
.ex { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--line); padding: 8px 0; }
.ex:first-of-type { border-top: 1px solid var(--line); }
.ex .nm { min-width: 0; }
.ex .nm small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
.ex .sr { font-family: var(--mono); font-size: 12px; color: var(--text-2); white-space: nowrap; }
.ex.done .nm { color: var(--muted); }
.sub-h { display: flex; align-items: center; gap: 8px; color: var(--text-2); margin: 24px 0 12px; font-weight: 500; }
.sub-h:first-child { margin-top: 0; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.steps li:first-child { border-top: 1px solid var(--line); }
.steps .mono { color: var(--muted); font-size: 12px; }

.topic { font-size: 20px; line-height: 26px; font-weight: 500; margin-bottom: 4px; text-wrap: balance; }
.topic-sub { color: var(--text-2); margin-bottom: 20px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px;
  font: inherit; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid transparent;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 120ms var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.secondary { background: var(--raised); color: var(--text); border-color: var(--line); }
.btn.secondary:hover { border-color: var(--line-2); }
.links { list-style: none; padding: 0; margin: 0; }
.links a {
  display: grid; grid-template-columns: minmax(0, 1fr) 16px; gap: 12px; align-items: center;
  padding: 10px 8px; margin: 0 -8px; border-radius: 8px; text-decoration: none;
  transition: background-color 150ms var(--ease);
}
.links a:hover { background: var(--raised); }
.links a small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
.links a svg { color: var(--muted); }

/* Gym: weekly plan + guided session (flow modeled on openGym) */
.gym { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.gym-plan { display: flex; flex-direction: column; gap: 4px; }
.gym-plan .plan-label { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.pday {
  display: grid; grid-template-columns: 28px 36px minmax(0, 1fr) auto 16px; gap: 12px; align-items: center;
  min-height: 64px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease);
}
.pday:hover { background: var(--raised); }
.pday[aria-pressed="true"] { background: var(--raised); border-color: var(--line); }
.pday .d { font-weight: 500; color: var(--muted); }
.pday.today .d { color: var(--accent); }
.pday .nm { min-width: 0; }
.pday .nm b { display: block; font-weight: 500; }
.pday .nm small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
.pday > svg.i { color: var(--muted); }
.tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--raised); color: var(--muted); }
.tile.on { background: var(--accent-soft); color: var(--accent); }
.tile svg.i { width: 18px; height: 18px; }
.pday[aria-pressed="true"] .tile:not(.on) { background: var(--card); }
.bodymap { display: block; flex: none; }
.bodymap rect { fill: var(--map); }
.bodymap rect.h { fill: var(--map-head); }
.bodymap rect.on { fill: var(--accent); }

.sess-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sess-top .t { flex: 1; min-width: 0; }
.sess-top .t .meta { margin-bottom: 4px; }
.sess-top h3 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 500; }
.sess-top .clockline { color: var(--text-2); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.vol { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin: 16px 0 20px; }
.vol .mono { font-size: 12px; color: var(--text-2); }
.preview { margin-top: 20px; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prow small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
.prow .sr { font-family: var(--mono); font-size: 12px; color: var(--text-2); white-space: nowrap; text-align: right; }
.prow .sr small { color: var(--muted); }
.done-banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--text); margin-top: 16px; }
.done-banner svg.i { color: var(--accent); }

.dots { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.dots button {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--raised); color: var(--text-2);
  font: 500 13px var(--mono); cursor: pointer; display: grid; place-items: center;
  transition: background-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.dots button.full { background: var(--accent); color: var(--on-accent); }
.dots button.cur { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); color: var(--text); }
.dots button.cur.full { color: var(--on-accent); }
.ex-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.ex-title { font-size: 20px; line-height: 26px; font-weight: 500; margin: 0 0 8px; text-wrap: balance; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--text-2); font-size: 12px; display: inline-flex; align-items: center; }
.chip.pr { color: var(--accent); }
.ex-lines { display: flex; flex-direction: column; gap: 4px; color: var(--text-2); }
.ex-lines .muted { color: var(--muted); }
.ex-lines .mono { font-size: 13px; }
.prog { display: flex; gap: 8px; align-items: flex-start; color: var(--accent); margin-top: 8px; }
.prog b { font-weight: 500; }
.prog svg.i { margin-top: 2px; }

.sets { margin-top: 20px; background: var(--raised); border-radius: 14px; padding: 12px; }
.set-row, .set-hd { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.set-row.one, .set-hd.one { grid-template-columns: 28px minmax(0, 1fr) 40px; }
.set-hd { color: var(--muted); font-size: 12px; padding: 0 0 8px; text-align: center; }
.set-row + .set-row { margin-top: 8px; }
.set-n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 500 12px var(--mono); color: var(--text-2); background: var(--card); }
.set-row.done .set-n { background: var(--accent-soft); color: var(--accent); }
.stepper { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; height: 44px; background: var(--card); border-radius: 10px; border: 1px solid var(--line); }
.stepper button { border: 0; background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center; border-radius: 9px; font: inherit; }
.stepper button:hover { color: var(--text); }
.stepper input {
  min-width: 0; width: 100%; border: 0; background: transparent; color: var(--text); text-align: center;
  font: 500 16px var(--mono); font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input::placeholder { color: var(--muted); }
.set-row.done .stepper { opacity: 0.6; }
.chk {
  width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line-2); background: transparent; color: var(--on-accent);
  cursor: pointer; display: grid; place-items: center; transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 120ms var(--ease);
}
.chk:active { transform: scale(0.96); }

  Object.values(SCHED).forEach(list => list.forEach((b, i) => b.i = i));

  const DAY_NOTE = {
    5: 'Keep cardio easy so you can wind down after. Friday bedtime is ideally 10:00 to 11:00 PM. Try not to shift your sleep schedule too much.',
    6: 'Bedtime around 11:00 PM still gives you 9 hours before an 8:00 AM wake-up.',
  };
  const GOLF_NOTE = 'Golf blocks assume about 30 minutes of round-trip driving. Adjust if the drive is longer.';

  const GOLF = {
    2: { name: 'Range session', steps: [
      ['10 min', 'Warm up with half wedge swings'],
      ['25 min', 'Wedge distance ladder: 50, 75 and 100 yards, 5 balls each'],
      ['25 min', '7-iron with an alignment stick, pick a target for every ball'],
      ['15 min', 'Driver: 10 balls into an imaginary fairway, count how many land in it'],
      ['10 min', 'Putting green if there is one: 3, 6 and 9 foot putts'],
    ]},
    5: { name: 'Short game and range', steps: [
      ['30 min', 'Chipping: up-and-down game from 5 different lies'],
      ['20 min', 'Putting ladder: 3, 6, 9 feet, make 3 in a row before moving back'],
      ['25 min', 'Range with mid irons, alternate draw and straight shots'],
    ]},
    6: { name: 'Play or simulate a round', steps: [
      ['90 min', 'Play 9 holes if you can. Otherwise play a round on the range: change club and target every ball'],
      ['After', 'Write down fairways, greens and putts to find next week’s weakness'],
    ]},
    0: { name: 'Fix this week’s weakness', steps: [
      ['15 min', 'Warm up through the bag'],
      ['45 min', 'Work on the weakest part from Saturday’s notes'],
      ['20 min', 'Pressure putting: 10 putts from 4 feet, start over on a miss'],
    ]},
  };

  /* SAT: one hour a day, 7 hours a week */
  const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
  const QBANK = 'https://satsuitequestionbank.collegeboard.org/';
  const SAT = {
    1: { area: 'Math', topic: 'Algebra', detail: 'Linear equations, systems and inequalities', q: 'digital SAT algebra linear equations systems' },
    2: { area: 'Reading and Writing', topic: 'Craft and structure', detail: 'Words in context, text structure, cross-text connections', q: 'digital SAT words in context text structure' },
    3: { area: 'Math', topic: 'Advanced math', detail: 'Quadratics, exponentials and functions', q: 'digital SAT advanced math quadratics functions' },
    4: { area: 'Reading and Writing', topic: 'Standard English conventions', detail: 'Punctuation, sentence boundaries, verb forms', q: 'digital SAT grammar punctuation boundaries' },
    5: { area: 'Reading and Writing', topic: 'Information and ideas', detail: 'Central ideas, command of evidence, inferences', q: 'digital SAT command of evidence inferences' },
    6: { area: 'Math', topic: 'Data analysis and geometry', detail: 'Ratios, percentages, statistics, circles and triangles', q: 'digital SAT problem solving data analysis geometry' },
    0: { area: 'Full practice', topic: 'Timed module and review', detail: 'One timed module in Bluebook, then go through every miss', q: 'digital SAT practice test review strategy' },
  };
  const SAT_STEPS = [
    ['15 min', 'Watch one lesson on today’s topic'],
    ['35 min', 'Practice questions in the Question Bank, timed'],
    ['10 min', 'Write each miss in your mistake log and why you missed it'],
  ];
  const RESOURCES = [
    ['Khan Academy digital SAT', 'Free lessons and practice, official partner', 'https://www.khanacademy.org/test-prep/digital-sat'],
    ['SAT Suite Question Bank', 'Official College Board questions by topic', QBANK],
    ['Bluebook practice tests', 'Full-length adaptive tests, same app as test day', 'https://satsuite.collegeboard.org/practice/practice-tests'],
    ['Scalar Learning on YouTube', 'Math walk-throughs and Desmos shortcuts', yt('Scalar Learning digital SAT math')],
    ['SupertutorTV on YouTube', 'Reading and writing strategy', yt('SupertutorTV digital SAT reading writing')],
    ['Desmos calculator', 'Practice with the calculator built into the test', 'https://www.desmos.com/calculator'],
  ];

  /* Theme: dark by default; dark, light or follow the device, remembered in this browser */
  const THEME_KEY = 'life-planner-theme';
  let theme = 'dark';
  try { theme = localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) {}
  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('themeBtn');
    const label = { dark: 'Dark', light: 'Light', system: 'System' }[theme];
    btn.innerHTML = `<svg class="i"><use href="#i-${theme === 'light' ? 'sun' : 'moon'}"/></svg>${label}`;
    btn.setAttribute('aria-label', `Theme: ${label}. Switch to ${theme === 'dark' ? 'light' : 'dark'}`);
  }
  function setTheme(t) { theme = t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} applyTheme(); if (typeof renderPrefs === 'function' && currentView() === 'preferences') renderPrefs(); }
  applyTheme();
  document.getElementById('themeBtn').addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));

  /* Storage: per-browser convenience, safe if blocked */
  const KEY = 'life-planner-v1';
  let store = { done: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign({ done: {} }, JSON.parse(raw)); } catch (e) {}
  store.prefs = Object.assign({ unit: 'lb', restTimer: true, vibrate: true }, store.prefs);
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  // Ask the browser to keep this site's data instead of clearing it when space runs low
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  const isDone = k => !!store.done[k];
  function setDone(k, v) { if (v) store.done[k] = 1; else delete store.done[k]; save(); render(); }

  /* Dates */
  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
  function dateFor(dow, now) { const x = weekStart(now); x.setDate(x.getDate() + ORDER.indexOf(dow)); return x; }
  function weekNo(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
  const blockKey = (dow, i, now) => keyOf(dateFor(dow, now)) + ':b' + i;
  const exKey = (dow, i, now) => keyOf(dateFor(dow, now)) + ':x' + i;

  function fmt(min, withAp = true) {
    const m = ((min % 1440) + 1440) % 1440; let h = Math.floor(m / 60); const mm = m % 60;
    const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return h + ':' + pad(mm) + (withAp ? ' ' + ap : '');
  }
  function rangeLabel(b) { return b.cat === 'sleep' ? fmt(b.s) : fmt(b.s, (b.s < 720) !== (b.e < 720)) + '–' + fmt(b.e); }
  function dur(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''); }
  function shortLabel(b) {
    if (b.cat === 'work') return /^app/i.test(b.label) ? 'App dev' : /homework and/i.test(b.label) ? 'Homework' : 'HW / app';
    return CAT[b.cat].short;
  }
  const isApp = b => b.cat === 'work' && /app/i.test(b.label);
  const icon = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  let selected = new Date().getDay();
  let lastToday = new Date().getDay();

  /* What's happening now */
  function current(now) {
    const dow = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
    const list = SCHED[dow];
    if (m < list[0].s) {
      const prev = SCHED[(dow + 6) % 7]; const sl = prev[prev.length - 1];
      return { b: { label: 'Sleep', cat: 'sleep', s: sl.s - 1440, e: list[0].s }, next: list[0], m };
    }
    const i = list.findIndex(b => m >= b.s && m < b.e);
    const b = list[i];
    let next = list[i + 1];
    if (!next) next = SCHED[(dow + 1) % 7][0];
    return { b, next, m, dow, i };
  }

  function renderHeader(now) {
    const v = typeof currentView === 'function' ? currentView() : 'today';
    document.getElementById('title').innerHTML = v === 'today' ? `${DAY[now.getDay()]}, ${MONTH[now.getMonth()]} ${now.getDate()} <span class="yr">${now.getFullYear()}</span>` : VIEWS[v];
    const ws = weekStart(now), we = new Date(ws); we.setDate(we.getDate() + 6);
    document.getElementById('subtitle').textContent = v === 'today' ? `Week ${weekNo(now)} · school, SAT, gym, golf and app work around 8 hours of sleep` : `${DAY[now.getDay()]}, ${MONTH[now.getMonth()]} ${now.getDate()} · week ${weekNo(now)}`;
    document.getElementById('clock').textContent = fmt(now.getHours() * 60 + now.getMinutes());
    const sm = (d) => `${MONTH[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
    document.getElementById('weekRange').textContent = `${sm(ws)} – ${sm(we)}`;
    const tonight = SCHED[now.getDay()].slice(-1)[0];
    document.getElementById('sideSleep').textContent = `Lights out ${fmt(tonight.s)}`;
  }

  function renderNow(now) {
    const c = current(now), b = c.b;
    const span = b.e - b.s, gone = c.m - (b.s < 0 && c.m >= b.e ? b.s + 1440 : b.s);
    const left = b.e - c.m;
    const pct = Math.max(0, Math.min(1, gone / span));
    const nextDay = c.next && SCHED[now.getDay()].indexOf(c.next) === -1;
    document.getElementById('now').innerHTML = `
      <div class="now-label"><span class="dot" style="--c:var(--c-${b.cat})"></span>Now · <span class="mono">${b.cat === 'sleep' ? 'until ' + fmt(b.e) : rangeLabel(b)}</span></div>
      <div class="now-title">${esc(b.label)}</div>
      <div>
        <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Block progress"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
        <div class="now-foot" style="margin-top:8px"><span class="mono">${dur(Math.max(left, 0)) || 'under a minute'} left</span><span class="mono">${dur(Math.max(gone, 0)) || '0 min'} in</span></div>
      </div>
      <div class="now-next">${icon('arrow')}<span>Next${nextDay ? ' tomorrow' : ''} at <span class="mono">${fmt(c.next.s)}</span> · <b>${esc(c.next.label)}</b></span></div>`;
  }

  function weekCounts(now) {
    const out = { gym: [0, 0, []], golf: [0, 0, []], sat: [0, 0, []], app: [0, 0, []] };
    ORDER.forEach(dow => SCHED[dow].forEach(b => {
      const k = blockKey(dow, b.i, now);
      const add = (name, amt) => { out[name][1] += amt; if (isDone(k)) out[name][0] += amt; else out[name][2].push(SHORT[dow]); };
      if (b.cat === 'gym' || b.cat === 'cardio') add('gym', 1);
      if (b.cat === 'golf') add('golf', 1);
      if (b.cat === 'sat') add('sat', (b.e - b.s) / 60);
      if (isApp(b)) add('app', 1);
    }));
    return out;
  }

  function renderStats(now) {
    const c = weekCounts(now);
    const card = (lab, done, total, unit, left) => {
      const ok = done >= total;
      const rest = left.length ? `${left.length} left · ${left.join(', ')}` : '';
      return `<div class="card stat"><div class="lab">${lab}</div>
        <div class="fig">${done}<small> of ${total}${unit}</small></div>
        <div class="chg ${ok ? 'ok' : ''}">${ok ? 'Target hit this week' : rest}</div></div>`;
    };
    document.getElementById('stats').innerHTML =
      card('Workouts', c.gym[0], 5, '', c.gym[2]) +
      card('Golf sessions', c.golf[0], 4, '', c.golf[2]) +
      card('SAT prep', c.sat[0], 7, ' h', c.sat[2]) +
      `<div class="card stat"><div class="lab">App development</div>
        <div class="fig">${c.app[0]}<small> of ${c.app[1]} blocks</small></div>
        <div class="chg">Weekend blocks plus any homework-or-app evening</div></div>`;
  }

  function renderTabs(now) {
    const today = now.getDay();
    document.getElementById('tabs').innerHTML = ORDER.map(d =>
      `<button role="tab" id="tab-${d}" aria-selected="${d === selected}" data-dow="${d}" title="${DAY[d]}">${SHORT[d]}${d === today ? '<span class="today-mark" aria-hidden="true"></span>' : ''}</button>`).join('');
  }

  function renderDay(now) {
    const dow = selected, list = SCHED[dow], isToday = dow === now.getDay();
    const m = now.getHours() * 60 + now.getMinutes();
    const todayIdx = ORDER.indexOf(now.getDay()), selIdx = ORDER.indexOf(dow);
    const main = list.filter(b => b.cat === 'gym' || b.cat === 'cardio' || b.cat === 'golf').map(b => CAT[b.cat].name).join(' and ');
    document.getElementById('dayTitle').textContent = `${isToday ? 'Today' : DAY[dow]} · ${main}`;

    const span = AXIS_END - AXIS_START;
    const segs = [];
    if (list[0].s > AXIS_START) segs.push({ s: AXIS_START, e: list[0].s, cat: 'sleep', label: 'Sleep', i: -1 });
    list.forEach(b => segs.push(b));
    const html = segs.map(b => {
      const s = Math.max(b.s, AXIS_START), e = Math.min(b.e, AXIS_END);
      const left = (s - AXIS_START) / span * 100, w = (e - s) / span * 100;
      const done = b.i >= 0 && TRACK.includes(b.cat) && isDone(blockKey(dow, b.i, now));
      const past = selIdx < todayIdx || (isToday && e <= m);
      const soft = ['routine', 'school', 'sleep'].includes(b.cat);
      const lab = w > 5 ? shortLabel(b) : '';
      return `<div class="seg ${soft ? 'soft' : ''} ${done ? 'done' : ''} ${past ? 'past' : ''}" style="left:${left}%;width:${w}%;--c:var(--c-${b.cat})" title="${esc(b.label)} · ${rangeLabel(b)}">${lab}</div>`;
    }).join('');
    const ticks = [6, 9, 12, 15, 18, 21, 24].map(h =>
      `<span style="left:${(h * 60 - AXIS_START) / span * 100}%">${h === 12 ? '12p' : h === 24 ? '12a' : (h % 12) + (h < 12 ? 'a' : 'p')}</span>`).join('');
    let pin = '';
    if (isToday && m >= AXIS_START && m < AXIS_END) {
      const p = (m - AXIS_START) / span * 100;
      const flip = p > 85;
      pin = `<div class="pin" style="left:${p}%" aria-hidden="true"><svg viewBox="0 0 14 12" style="${flip ? 'transform:scaleX(-1);left:-13px' : ''}"><path d="M0 0h14l-4 5 4 5H0z"/></svg><span class="t" style="${flip ? 'left:auto;right:16px' : ''}">${fmt(m)}</span></div>`;
    }
    document.getElementById('stripWrap').innerHTML =
      `<div class="strip" role="img" aria-label="${DAY[dow]} timeline from 6 AM to midnight">${html}</div><div class="axis">${ticks}</div>${pin}`;

    document.getElementById('legend').innerHTML = ['school', 'gym', 'cardio', 'golf', 'sat', 'work', 'free', 'routine', 'sleep']
      .filter(c => list.some(b => b.cat === c) || c === 'sleep')
      .map(c => `<span><span class="dot" style="--c:var(--c-${c})"></span>${CAT[c].name}</span>`).join('');

    const cur = isToday ? list.findIndex(b => m >= b.s && m < b.e) : -1;
    document.getElementById('blocks').innerHTML = list.map(b => {
      const track = TRACK.includes(b.cat);
      const k = blockKey(dow, b.i, now), done = track && isDone(k);
      const id = `b-${dow}-${b.i}`;
      return `<div class="row ${b.i === cur ? 'cur' : ''} ${done ? 'done' : ''}">
        <span class="tm">${rangeLabel(b)}</span>
        <span class="dot" style="--c:var(--c-${b.cat})"></span>
        <label class="lb" for="${id}">${esc(b.label)}</label>
        ${track ? `<input type="checkbox" id="${id}" data-k="${k}" ${done ? 'checked' : ''} aria-label="Mark ${esc(b.label)} done">` : '<span></span>'}
      </div>`;
    }).join('');

    const notes = [];
    if (DAY_NOTE[dow]) notes.push(DAY_NOTE[dow]);
    if (list.some(b => b.cat === 'golf')) notes.push(GOLF_NOTE);
    const sl = list[list.length - 1], wake = SCHED[(dow + 1) % 7][0].s;
    notes.unshift(`Sleep ${fmt(sl.s)} to ${fmt(wake)} · ${dur(1440 - sl.s + wake)}.`);
    document.getElementById('dayNote').textContent = notes.join(' ');
  }

  function renderGolf(now) {
    const dow = selected, g = GOLF[dow], isToday = dow === now.getDay();
    const blk = SCHED[dow].find(b => b.cat === 'golf');
    const who = isToday ? 'Today’s' : DAY[dow] + '’s';
    if (!g) {
      const next = ORDER.slice(ORDER.indexOf(dow) + 1).concat(ORDER).find(d => GOLF[d]);
      document.getElementById('golf').innerHTML = `<div class="card-head"><h2>${who} golf</h2><span class="meta">No golf</span></div>
        <p class="sub" style="margin:0">No golf ${isToday ? 'today' : 'on ' + DAY[dow]}. Next session is ${DAY[next]}, ${GOLF[next].name.toLowerCase()}.</p>`;
      return;
    }
    document.getElementById('golf').innerHTML = `
      <div class="card-head"><h2>${who} golf</h2><span class="meta">${rangeLabel(blk)}</span></div>
      <div class="topic">${g.name}</div>
      <div class="topic-sub">Suggested practice plan for the session</div>
      <ol class="steps">${g.steps.map(x => `<li><span class="mono">${x[0]}</span><span>${esc(x[1])}</span></li>`).join('')}</ol>
      <div class="note">${GOLF_NOTE}</div>`;
  }

  function renderSat(now) {
    const dow = selected, s = SAT[dow], isToday = dow === now.getDay();
    const blk = SCHED[dow].find(b => b.cat === 'sat');
    const practice = dow === 0 ? ['Open Bluebook tests', 'https://satsuite.collegeboard.org/practice/practice-tests'] : ['Practice questions', QBANK];
    document.getElementById('sat').innerHTML = `
      <div class="card-head"><h2>${isToday ? 'Today’s SAT hour' : DAY[dow] + '’s SAT hour'}</h2><span class="meta">${rangeLabel(blk)}</span></div>
      <div class="meta" style="margin-bottom:4px">${s.area}</div>
      <div class="topic">${s.topic}</div>
      <div class="topic-sub">${s.detail}</div>
      <div class="actions">
        <a class="btn primary" href="${yt(s.q)}" target="_blank" rel="noopener">${icon('play')}Watch on YouTube</a>
        <a class="btn secondary" href="${practice[1]}" target="_blank" rel="noopener">${icon('pencil')}${practice[0]}</a>
      </div>
      <ol class="steps">${SAT_STEPS.map(x => `<li><span class="mono">${x[0]}</span><span>${x[1]}</span></li>`).join('')}</ol>
      <div class="sub-h" style="margin-top:24px">${icon('book')}Study links</div>
      <ul class="links">${RESOURCES.map(r => `<li><a href="${r[2]}" target="_blank" rel="noopener"><span>${r[0]}<small>${r[1]}</small></span>${icon('ext')}</a></li>`).join('')}</ul>`;
  }

  function renderWeek(now) {
    const cols = [['gym', 'Workout'], ['golf', 'Golf'], ['sat', 'SAT'], ['work', 'Homework / app']];
    const today = now.getDay();
    const head = `<thead><tr><th>Day</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}<th>Lights out</th></tr></thead>`;
    const totals = { gym: [0, 0], golf: [0, 0], sat: [0, 0], work: [0, 0] };
    const rows = ORDER.map(dow => {
      const d = dateFor(dow, now), list = SCHED[dow];
      const cells = cols.map(([cat]) => {
        const bs = list.filter(b => b.cat === cat || (cat === 'gym' && b.cat === 'cardio'));
        if (!bs.length) return '<td><span class="dash">–</span></td>';
        return '<td>' + bs.map(b => {
          const k = blockKey(dow, b.i, now), on = isDone(k);
          const amt = cat === 'sat' ? (b.e - b.s) / 60 : 1;
          totals[cat][1] += amt; if (on) totals[cat][0] += amt;
          return `<button class="cell" data-k="${k}" aria-pressed="${on}" title="${esc(b.label)} · ${rangeLabel(b)}" aria-label="${DAY[dow]} ${esc(b.label)}">${icon('check')}</button>`;
        }).join('') + '</td>';
      }).join('');
      const sl = list[list.length - 1];
      return `<tr class="${dow === today ? 'is-today' : ''}"><td><b>${SHORT[dow]}</b><span>${d.getDate()}</span></td>${cells}<td class="mono" style="color:var(--text-2);font-size:12px">${fmt(sl.s)}</td></tr>`;
    }).join('');
    const tgt = { gym: 5, golf: 4, sat: 7, work: totals.work[1] };
    const foot = `<tfoot><tr><td>Total</td>${cols.map(([c]) => `<td>${totals[c][0]} / ${tgt[c]}${c === 'sat' ? ' h' : ''}</td>`).join('')}<td></td></tr></tfoot>`;
    document.getElementById('score').innerHTML = head + '<tbody>' + rows + '</tbody>' + foot;
  }

  function render() {
    const now = new Date();
    if (now.getDay() !== lastToday) { selected = now.getDay(); lastToday = selected; }
    renderHeader(now); renderNow(now); renderStats(now); renderTabs(now);
    renderDay(now); renderSat(now); renderSatWeek(now); renderGolf(now); renderGymTeaser(); renderWeek(now);
  }

  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k) setDone(k, e.target.checked);
  });
  document.addEventListener('click', e => {
    const tab = e.target.closest('[data-dow]');
    if (tab) { selected = Number(tab.dataset.dow); render(); document.getElementById('tab-' + selected).focus(); return; }
    const cell = e.target.closest('.cell');
    if (cell) { setDone(cell.dataset.k, cell.getAttribute('aria-pressed') !== 'true'); return; }
  });
  document.getElementById('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = ORDER.indexOf(selected) + (e.key === 'ArrowRight' ? 1 : -1);
    selected = ORDER[(i + 7) % 7]; render(); document.getElementById('tab-' + selected).focus();
  });

  /* ---------- Gym: plan + guided sessions (flow inspired by openGym) ---------- */
  // k: weight = load × reps, bw = added load × reps, reps = reps only, time = minutes, cardio = speed × minutes, carry = load × meters
  const EX = {
    bench:      { n: 'Bench press', m: ['chest', 'triceps', 'shoulders'], eq: 'Barbell', k: 'weight', sets: 4, r: [6, 8], step: 5, rest: 120, tip: 'Leave 1 to 2 reps in the tank' },
    db_ohp:     { n: 'Seated dumbbell shoulder press', m: ['shoulders', 'triceps'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [8, 10], step: 5, rest: 90 },
    incline_db: { n: 'Incline dumbbell press', m: ['chest', 'shoulders'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [8, 10], step: 5, rest: 90 },
    dips:       { n: 'Dips', m: ['chest', 'triceps'], eq: 'Bodyweight', k: 'bw', sets: 3, r: [8, 12], step: 5, rest: 90, tip: 'Add weight with a belt once 12 reps feel easy' },
    lateral:    { n: 'Lateral raise', m: ['shoulders'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [12, 15], step: 5, rest: 60, tip: 'Light, slow on the way down' },
    pallof:     { n: 'Pallof press', m: ['obliques', 'abs'], eq: 'Cable', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 60, tip: 'Reps per side. Resist the twist, brace like at address' },
    pullup:     { n: 'Pull-ups', m: ['lats', 'biceps', 'upperback'], eq: 'Bodyweight', k: 'bw', sets: 4, r: [6, 8], step: 5, rest: 120, tip: 'Use the assisted machine or a band if needed' },
    bb_row:     { n: 'Barbell row', m: ['upperback', 'lats', 'biceps'], eq: 'Barbell', k: 'weight', sets: 3, r: [8, 10], step: 5, rest: 90, tip: 'Flat back, pull to the lower ribs' },
    pulldown:   { n: 'Lat pulldown', m: ['lats', 'biceps'], eq: 'Cable', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 90 },
    facepull:   { n: 'Face pull', m: ['shoulders', 'upperback'], eq: 'Cable', k: 'weight', sets: 3, r: [15, 20], step: 5, rest: 60, tip: 'Good for posture and shoulder health' },
    hammer:     { n: 'Hammer curl', m: ['biceps', 'forearms'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 60 },
    woodchop:   { n: 'Cable woodchop', m: ['obliques', 'abs'], eq: 'Cable', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 60, tip: 'Reps per side. Rotate from the hips, not the arms' },
    incline_bb: { n: 'Incline barbell press', m: ['chest', 'shoulders', 'triceps'], eq: 'Barbell', k: 'weight', sets: 4, r: [8, 10], step: 5, rest: 120 },
    arnold:     { n: 'Arnold press', m: ['shoulders', 'triceps'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 90 },
    mach_press: { n: 'Machine chest press', m: ['chest', 'triceps'], eq: 'Machine', k: 'weight', sets: 3, r: [10, 12], step: 10, rest: 90 },
    cable_fly:  { n: 'Cable fly', m: ['chest'], eq: 'Cable', k: 'weight', sets: 3, r: [12, 15], step: 5, rest: 60, tip: 'Squeeze at the middle' },
    oh_tri:     { n: 'Overhead triceps extension', m: ['triceps'], eq: 'Cable', k: 'weight', sets: 3, r: [12, 15], step: 5, rest: 60 },
    deadbug:    { n: 'Dead bug', m: ['abs'], eq: 'Bodyweight', k: 'reps', sets: 3, r: [10, 12], rest: 45, tip: 'Reps per side. Slow, low back stays down' },
    trapbar:    { n: 'Trap bar deadlift', m: ['glutes', 'hamstrings', 'lowerback', 'quads', 'traps'], eq: 'Trap bar', k: 'weight', sets: 4, r: [5, 6], step: 10, rest: 150, tip: 'Stop the set before your form breaks down' },
    chinup:     { n: 'Chin-ups', m: ['lats', 'biceps'], eq: 'Bodyweight', k: 'bw', sets: 3, r: [6, 8], step: 5, rest: 120, tip: 'Palms facing you' },
    cable_row:  { n: 'Seated cable row', m: ['upperback', 'lats'], eq: 'Cable', k: 'weight', sets: 3, r: [10, 12], step: 10, rest: 90 },
    db_row:     { n: 'One-arm dumbbell row', m: ['lats', 'upperback'], eq: 'Dumbbell', k: 'weight', sets: 3, r: [10, 12], step: 5, rest: 60, tip: 'Reps per arm' },
    rear_fly:   { n: 'Rear delt fly', m: ['shoulders', 'upperback'], eq: 'Dumbbells', k: 'weight', sets: 3, r: [15, 20], step: 5, rest: 60 },
    bb_curl:    { n: 'Barbell curl', m: ['biceps', 'forearms'], eq: 'Barbell', k: 'weight', sets: 3, r: [8, 10], step: 5, rest: 60 },
    farmer:     { n: 'Farmer carry', m: ['forearms', 'traps', 'abs'], eq: 'Dumbbells', k: 'carry', sets: 3, r: [30, 40], step: 5, rest: 90, tip: 'Heavy, tall posture. Weight is per hand' },
    warm_walk:  { n: 'Warm-up walk', m: ['calves'], eq: 'Treadmill', k: 'time', sets: 1, r: [5, 5], rest: 0 },
    steady:     { n: 'Easy jog, bike or incline walk', m: ['quads', 'hamstrings', 'calves', 'glutes'], eq: 'Cardio machine', k: 'cardio', sets: 1, r: [20, 25], rest: 0, tip: 'Easy effort. You should be able to talk in full sentences' },
    cool_walk:  { n: 'Cool-down walk and stretch', m: ['hamstrings', 'calves'], eq: 'Bodyweight', k: 'time', sets: 1, r: [5, 5], rest: 0, tip: 'Hips, hamstrings, calves' },
  };
  const KIND = {
    weight: { a: 'Weight', b: 'Reps', bStep: 1 },
    bw:     { a: 'Added', b: 'Reps', bStep: 1 },
    reps:   { a: null, b: 'Reps', bStep: 1 },
    time:   { a: null, b: 'Minutes', bStep: 1 },
    cardio: { a: 'Speed (mph)', b: 'Minutes', bStep: 1, aStep: 0.1 },
    carry:  { a: 'Per hand', b: 'Meters', bStep: 5 },
  };
  const ROUTINE = {
    1: { name: 'Push A', type: 'push', ex: ['bench', 'db_ohp', 'incline_db', 'dips', 'lateral', 'pallof'] },
    3: { name: 'Pull A', type: 'pull', ex: ['pullup', 'bb_row', 'pulldown', 'facepull', 'hammer', 'woodchop'] },
    4: { name: 'Push B', type: 'push', ex: ['incline_bb', 'arnold', 'mach_press', 'cable_fly', 'oh_tri', 'deadbug'] },
    5: { name: 'Cardio', type: 'cardio', ex: ['warm_walk', 'steady', 'cool_walk'] },
    6: { name: 'Pull B', type: 'pull', ex: ['trapbar', 'chinup', 'cable_row', 'db_row', 'rear_fly', 'bb_curl', 'farmer'] },
  };
  const MOBILITY = [
    ['90/90 hip switches', '2 × 8 each side'],
    ['Open books', '2 × 8 each side'],
    ['Cat-cow', '2 × 10'],
    ['Hip flexor stretch', '2 × 30 s each side'],
  ];
  const cap = m => ({ upperback: 'Upper back', lowerback: 'Lower back' }[m] || m[0].toUpperCase() + m.slice(1));
  const shortDate = d => { const [y, mo, da] = d.split('-').map(Number); return MONTH[mo - 1].slice(0, 3) + ' ' + da; };
  const routineMuscles = r => [...new Set(r.ex.flatMap(id => EX[id].m))];
  const repLabel = e => e.k === 'time' || e.k === 'cardio' ? `${e.r[0] === e.r[1] ? e.r[0] : e.r[0] + '–' + e.r[1]} min`
    : `${e.sets} × ${e.r[0]}–${e.r[1]}${e.k === 'carry' ? ' m' : ''}`;

  /* Body map: front and back, muscles drawn as soft blocks */
  const FIG_FRONT = [
    [null, 23, 3, 14, 14, 7], [null, 27, 16, 6, 5, 2],
    ['shoulders', 11, 22, 10, 10, 5], ['shoulders', 39, 22, 10, 10, 5],
    ['chest', 20, 23, 9.5, 11, 3], ['chest', 30.5, 23, 9.5, 11, 3],
    ['biceps', 10, 33, 6, 12, 3], ['biceps', 44, 33, 6, 12, 3],
    ['forearms', 8, 46, 6, 15, 3], ['forearms', 46, 46, 6, 15, 3],
    ['obliques', 20, 36, 3.5, 17, 1.75], ['obliques', 36.5, 36, 3.5, 17, 1.75],
    ['abs', 24.5, 35, 11, 20, 3], [null, 21, 56, 18, 6, 3],
    ['quads', 20, 63, 9.5, 26, 4], ['quads', 30.5, 63, 9.5, 26, 4],
    ['calves', 21, 92, 7.5, 22, 3], ['calves', 31.5, 92, 7.5, 22, 3],
  ];
  const FIG_BACK = [
    [null, 23, 3, 14, 14, 7], [null, 27, 16, 6, 4, 2],
    ['traps', 22, 19, 16, 6, 3],
    ['shoulders', 11, 22, 10, 10, 5], ['shoulders', 39, 22, 10, 10, 5],
    ['upperback', 22, 26, 16, 8, 2],
    ['lats', 19.5, 35, 6.5, 15, 3], ['lats', 34, 35, 6.5, 15, 3],
    ['triceps', 10, 33, 6, 12, 3], ['triceps', 44, 33, 6, 12, 3],
    ['forearms', 8, 46, 6, 15, 3], ['forearms', 46, 46, 6, 15, 3],
    ['lowerback', 27, 35, 6, 19, 2],
    ['glutes', 20, 55, 9.5, 11, 4], ['glutes', 30.5, 55, 9.5, 11, 4],
    ['hamstrings', 20, 67, 9.5, 23, 4], ['hamstrings', 30.5, 67, 9.5, 23, 4],
    ['calves', 21, 92, 7.5, 22, 3], ['calves', 31.5, 92, 7.5, 22, 3],
  ];
  function bodyMap(muscles, w) {
    const on = new Set(muscles);
    const fig = (shapes, dx) => shapes.map(([m, x, y, ww, h, r]) =>
      `<rect class="${m ? (on.has(m) ? 'on' : '') : 'h'}" x="${x + dx}" y="${y}" width="${ww}" height="${h}" rx="${r}"/>`).join('');
    return `<svg class="bodymap" viewBox="4 0 116 118" width="${w}" height="${Math.round(w * 118 / 116)}" aria-hidden="true">${fig(FIG_FRONT, 0)}${fig(FIG_BACK, 64)}</svg>`;
  }

  /* Gym state lives in the same per-browser store */
  store.logs = store.logs || {};      // exId -> [{ d, s: [[a, b], ...] }]
  store.hist = store.hist || [];      // finished sessions
  // store.sess: { d, dow, t0, cur, sets: { exId: [{ a, b, done }] }, end }
  const todayKey = () => keyOf(new Date());
  let gymSel = null;
  let rest = store.rest && (store.rest.paused || store.rest.end > Date.now()) ? store.rest : null;   // { end, total, paused, left }, kept across reloads
  let wake = null;

  function lastLog(id) {
    const l = (store.logs[id] || []).filter(x => x.d < todayKey());
    return l.length ? l[l.length - 1] : null;
  }
  function best(id) {
    const e = EX[id]; let b = 0;
    (store.logs[id] || []).forEach(x => x.s.forEach(([a, r]) => { const v = e.k === 'reps' || e.k === 'time' ? r : a; if (v > b) b = v; }));
    return b;
  }
  const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
  const U = () => (store.prefs && store.prefs.unit) || 'lb';
  const unitA = e => e.k === 'cardio' ? ' mph' : ' ' + U();
  const stepOf = e => U() === 'kg' ? e.step / 2 : e.step;
  const aLabel = K => K.aStep ? K.a : `${K.a} (${U()})`;
  function advice(id) {
    const e = EX[id], last = lastLog(id);
    if (!last && e.k === 'bw') return { up: false, text: `First time. Bodyweight only, add weight once you get ${e.r[1]} reps on every set` };
    if (!last) return { up: false, text: e.k === 'time' || e.k === 'cardio' ? 'First time. Keep it easy' : e.k === 'reps' ? `First time. Aim for ${e.r[0]} clean reps` : 'First time. Pick a weight you could do 2 more reps with' };
    if (e.k === 'time' || e.k === 'cardio') return { up: false, text: 'Same as last time, or add a minute if it felt easy' };
    const allTop = last.s.length >= e.sets && last.s.every(([, r]) => r >= e.r[1]);
    const anyLow = last.s.some(([, r]) => r < e.r[0]);
    if (e.k === 'reps') return allTop ? { up: true, text: `Every rep last time. Go slower or add ${e.r[1] > 12 ? 'a pause' : '2 reps'}` } : { up: false, text: `Aim for ${e.r[1]} reps on every set` };
    if (allTop) return { up: true, text: `Every rep last time. ${stepOf(e)} ${U()} more` };
    if (anyLow) return { up: false, text: `Same weight. Aim for at least ${e.r[0]} reps every set` };
    return { up: false, text: `Same weight. Add a rep where you can, ${e.r[1]} on every set moves you up` };
  }
  function initSets(id) {
    const e = EX[id], last = lastLog(id), adv = advice(id);
    const out = [];
    for (let i = 0; i < e.sets; i++) {
      const prev = last && (last.s[i] || last.s[last.s.length - 1]);
      let a = prev ? prev[0] : '';
      if (adv.up && a !== '' && KIND[e.k].a) a = a + stepOf(e);
      if (e.k === 'bw' && a === '') a = 0;
      const b = prev && !adv.up ? prev[1] : (e.k === 'time' || e.k === 'cardio' ? e.r[0] : e.r[0]);
      out.push({ a: KIND[e.k].a ? a : '', b, done: false });
    }
    return out;
  }

  function sessStats(s) {
    let done = 0, total = 0, vol = 0;
    ROUTINE[s.dow].ex.forEach(id => (s.sets[id] || []).forEach(x => {
      total++; if (x.done) { done++; if (EX[id].k === 'weight' && x.a) vol += x.a * x.b; }
    }));
    return { done, total, vol };
  }
  const mmss = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(s); };

  function startSession(dow) {
    const sets = {}; ROUTINE[dow].ex.forEach(id => sets[id] = initSets(id));
    store.sess = { d: todayKey(), dow, t0: Date.now(), cur: 0, sets, end: null };
    save(); keepAwake(true); renderGym();
  }
  function finishSession(silent) {
    const s = store.sess; if (!s || s.end) return;
    ROUTINE[s.dow].ex.forEach(id => {
      const done = (s.sets[id] || []).filter(x => x.done).map(x => [Number(x.a) || 0, Number(x.b) || 0]);
      if (!done.length) return;
      const list = store.logs[id] = (store.logs[id] || []).filter(x => x.d !== s.d);
      list.push({ d: s.d, s: done });
    });
    const st = sessStats(s);
    s.end = Date.now();
    store.hist.push({ d: s.d, dow: s.dow, mins: Math.round((s.end - s.t0) / 60000), sets: st.done, vol: st.vol });
    // Tick the schedule block for that day
    const [y, mo, da] = s.d.split('-').map(Number), day = new Date(y, mo - 1, da).getDay();
    const blk = SCHED[day].find(b => b.cat === 'gym' || b.cat === 'cardio');
    if (blk && st.done) store.done[s.d + ':b' + blk.i] = 1;
    rest = null; keepAwake(false); save();
    if (!silent) { renderGym(); render(); }
  }
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
      if (!on && wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; }
  }
  // An unfinished session from an earlier day gets saved with whatever sets were checked
  if (store.sess && !store.sess.end && store.sess.d !== todayKey()) finishSession(true);
  if (store.sess && store.sess.end && store.sess.d !== todayKey()) store.sess = null;

  function startRest(sec) {
    if (!sec || !store.prefs.restTimer) return;
    rest = { end: Date.now() + sec * 1000, total: sec, paused: false, left: sec };
    tickRest();
  }

  function renderGym() {
    const now = new Date(), today = now.getDay();
    if (gymSel === null) gymSel = ROUTINE[today] ? today : ORDER.slice(ORDER.indexOf(today)).concat(ORDER).find(d => ROUTINE[d]);
    const s = store.sess;
    const active = s && !s.end;

    const plan = ORDER.map(d => {
      const r = ROUTINE[d], isT = d === today;
      const golf = SCHED[d].some(b => b.cat === 'golf');
      const doneToday = store.hist.some(h => h.d === keyOf(dateFor(d, now)) && h.dow === d);
      const tile = r ? `<span class="tile on">${icon(r.type === 'cardio' ? 'activity' : 'dumbbell')}</span>` : `<span class="tile">${icon('moon')}</span>`;
      const sub = r ? `${r.ex.length} exercises${doneToday ? ' · done' : ''}` : golf ? 'Golf day, mobility only' : 'Rest';
      return `<button class="pday ${isT ? 'today' : ''}" data-gday="${d}" aria-pressed="${d === gymSel}">
        <span class="d">${SHORT[d].slice(0, 2)}</span>${tile}
        <span class="nm"><b>${r ? r.name : 'Rest day'}</b><small>${sub}</small></span>
        ${r ? bodyMap(routineMuscles(r), 44) : '<span></span>'}${icon('chev')}</button>`;
    }).join('');

    let right;
    if (active) right = sessionView(s);
    else if (s && s.end && s.d === todayKey() && s.dow === gymSel) right = summaryView(s);
    else right = previewView(gymSel, now);

    document.getElementById('gym').innerHTML = `
      <div class="card-head"><h2>Training plan</h2><span class="meta">Push · pull · push · cardio · pull</span></div>
      <div class="gym">
        <div class="gym-plan"><div class="plan-label">This week</div>${plan}</div>
        <div class="card" style="box-shadow:none">${right}</div>
      </div>`;
    tickRest(); tickClock(); renderGymTeaser();
  }

  function previewView(dow, now) {
    const r = ROUTINE[dow], isT = dow === now.getDay();
    if (!r) {
      const next = ORDER.slice(ORDER.indexOf(dow) + 1).concat(ORDER).find(d => ROUTINE[d]);
      return `<div class="sess-top"><span class="tile">${icon('moon')}</span><div class="t"><div class="meta">${isT ? 'Today' : DAY[dow]}</div><h3>Rest day</h3></div></div>
        <p class="sub" style="margin:12px 0 0">No gym${SCHED[dow].some(b => b.cat === 'golf') ? ', you have golf' : ''}. Next workout is ${DAY[next]}, ${ROUTINE[next].name}.</p>
        <div class="sub-h mob">${icon('activity')}Ten minutes of mobility for the swing</div>
        <div class="preview" style="margin-top:0">${MOBILITY.map((m, i) => `<div class="prow"><span class="n">${i + 1}</span><span>${m[0]}</span><span class="sr">${m[1]}</span></div>`).join('')}</div>`;
    }
    const blk = SCHED[dow].find(b => b.cat === 'gym' || b.cat === 'cardio');
    const doneT = isT && store.hist.filter(h => h.d === todayKey() && h.dow === dow).pop();
    const rows = r.ex.map((id, i) => {
      const e = EX[id], b = best(id), last = lastLog(id);
      return `<div class="prow"><span class="n">${i + 1}</span>
        <span>${esc(e.n)}<small>${e.m.map(cap).join(', ')} · ${e.eq}</small></span>
        <span class="sr">${repLabel(e)}${last && KIND[e.k].a && b ? `<small>best ${fmtNum(b)}${unitA(e)}</small>` : ''}</span></div>`;
    }).join('');
    return `<div class="sess-top">
        <span class="tile on">${icon(r.type === 'cardio' ? 'activity' : 'dumbbell')}</span>
        <div class="t"><div class="meta">${isT ? 'Today' : DAY[dow]} · ${rangeLabel(blk)}</div><h3>${r.name}</h3></div>
        ${bodyMap(routineMuscles(r), 64)}
        <button class="btn primary" data-act="start" data-rt="${dow}">${icon('play')}${doneT ? 'Start again' : 'Start'}</button>
      </div>
      ${doneT ? `<div class="done-banner">${icon('check')}<span>Done today · ${doneT.mins} min · ${doneT.sets} sets${doneT.vol ? ' · ' + fmtNum(doneT.vol) + ' ' + U() : ''}</span></div>` : ''}
      <div class="preview">${rows}</div>
      <div class="note">${r.type === 'cardio' ? 'Keep it easy so you can wind down for bed after.' : 'Weights fill in from last time. When you hit the top of the rep range on every set, the next session adds weight.'}</div>`;
  }

  function sessionView(s) {
    const r = ROUTINE[s.dow], st = sessStats(s);
    const id = r.ex[s.cur], e = EX[id], K = KIND[e.k], sets = s.sets[id];
    const last = lastLog(id), adv = advice(id), b = best(id);
    const dots = r.ex.map((x, i) => {
      const full = s.sets[x].every(z => z.done);
      return `<button data-act="goto" data-i="${i}" class="${full ? 'full' : ''} ${i === s.cur ? 'cur' : ''}" aria-label="Exercise ${i + 1}: ${esc(EX[x].n)}">${i + 1}</button>`;
    }).join('');
    const one = !K.a;
    const stepper = (si, f, v, label) => `<div class="stepper">
        <button data-act="dec" data-s="${si}" data-f="${f}" aria-label="Less ${label}">${icon('minus')}</button>
        <input type="number" inputmode="decimal" id="in-${id}-${si}-${f}" data-gs="${si}" data-gf="${f}" value="${v}" placeholder="–" aria-label="Set ${si + 1} ${label}">
        <button data-act="inc" data-s="${si}" data-f="${f}" aria-label="More ${label}">${icon('plus')}</button></div>`;
    const rows = sets.map((x, si) => `<div class="set-row ${one ? 'one' : ''} ${x.done ? 'done' : ''}">
        <span class="set-n">${si + 1}</span>
        ${K.a ? stepper(si, 'a', x.a, aLabel(K)) : ''}${stepper(si, 'b', x.b, K.b)}
        <button class="chk" data-act="chk" data-s="${si}" aria-pressed="${x.done}" aria-label="Set ${si + 1} done">${icon('check')}</button></div>`).join('');
    const lastTxt = last ? last.s.map(([a, rr]) => K.a ? `${fmtNum(a)}×${rr}` : `${rr}`).join(', ') : '';
    const pr = K.a && b && sets.some(x => x.done && Number(x.a) > b) ? '<span class="chip pr">New best</span>' : '';
    return `<div class="sess-top">
        <div class="t"><div class="meta">In progress</div><h3>${r.name}</h3>
          <div class="clockline"><span id="sessClock">0:00</span> · ${st.done}/${st.total} sets</div></div>
        <button class="btn primary" data-act="finish">${icon('check')}Finish</button>
      </div>
      <div class="vol"><div class="bar"><i style="width:${st.total ? st.done / st.total * 100 : 0}%"></i></div><span class="mono">${fmtNum(st.vol)} ${U()}</span></div>
      <div class="dots">${dots}</div>
      <div class="ex-head"><div style="min-width:0">
        <div class="ex-title">${esc(e.n)}</div>
        <div class="chips">${e.m.map(m => `<span class="chip">${cap(m)}</span>`).join('')}<span class="chip">${e.eq}</span>${b && K.a ? `<span class="chip">Best ${fmtNum(b)}${unitA(e)}</span>` : ''}${pr}</div>
      </div>${bodyMap(e.m, 72)}</div>
      <div class="ex-lines">
        <span>Plan <span class="mono">${repLabel(e)}</span>${e.rest ? ` · rest <span class="mono">${mmss(e.rest)}</span>` : ''}</span>
        ${lastTxt ? `<span class="muted">Last time (${shortDate(last.d)}): <span class="mono">${lastTxt}</span></span>` : ''}
        ${e.tip ? `<span class="muted">${esc(e.tip)}</span>` : ''}
      </div>
      <div class="prog" style="${adv.up ? '' : 'color:var(--text-2)'}">${icon(adv.up ? 'up' : 'arrow')}<span>${adv.up ? '<b>Progress</b> · ' : ''}${adv.text}</span></div>
      <div class="sets">
        <div class="set-hd ${one ? 'one' : ''}"><span>Set</span>${K.a ? `<span>${aLabel(K)}</span>` : ''}<span>${K.b}</span><span></span></div>
        ${rows}
        <div class="set-tools">
          <button class="btn ghost sm" data-act="addset">${icon('plus')}Add set</button>
          ${sets.length > 1 ? `<button class="btn ghost sm" data-act="delset">${icon('minus')}Remove last set</button>` : ''}
        </div>
      </div>
      <div class="ex-nav">
        <button class="btn secondary" data-act="prev" ${s.cur === 0 ? 'disabled' : ''}>Previous</button>
        <button class="btn secondary" data-act="next" ${s.cur === r.ex.length - 1 ? 'disabled' : ''}>Next exercise</button>
      </div>`;
  }

  function summaryView(s) {
    const r = ROUTINE[s.dow], st = sessStats(s);
    const rows = r.ex.map((id, i) => {
      const e = EX[id], done = s.sets[id].filter(x => x.done), K = KIND[e.k];
      return `<div class="prow"><span class="n">${i + 1}</span><span>${esc(e.n)}</span>
        <span class="sr">${done.length ? done.map(x => K.a ? `${fmtNum(Number(x.a) || 0)}×${x.b}` : x.b).join(', ') : 'skipped'}</span></div>`;
    }).join('');
    return `<div class="sess-top"><span class="tile on">${icon('check')}</span>
        <div class="t"><div class="meta">Finished</div><h3>${r.name}</h3></div>
        <button class="btn secondary" data-act="close">Back to plan</button></div>
      <div class="done-banner">${icon('check')}<span>${Math.round((s.end - s.t0) / 60000)} min · ${st.done} sets${st.vol ? ' · ' + fmtNum(st.vol) + ' ' + U() + ' lifted' : ''}. Marked done in your schedule</span></div>
      <div class="preview">${rows}</div>`;
  }

  function tickClock() {
    const el = document.getElementById('sessClock');
    if (el && store.sess && !store.sess.end) el.textContent = mmss((Date.now() - store.sess.t0) / 1000);
  }
  function tickRest() {
    const dock = document.getElementById('restDock');
    if ((store.rest || null) !== rest) { store.rest = rest; save(); }
    document.body.classList.toggle('resting', !!rest);
    if (!rest) { dock.hidden = true; return; }
    const left = rest.paused ? rest.left : (rest.end - Date.now()) / 1000;
    dock.hidden = false;
    const over = left <= 0;
    dock.classList.toggle('over', over);
    dock.querySelector('.rt').textContent = over ? 'Go' : mmss(left);
    dock.querySelector('.rl').textContent = over ? 'Rest is over, next set' : rest.paused ? 'Rest paused' : 'Rest';
    dock.querySelector('.bar i').style.width = Math.max(0, Math.min(100, (1 - left / rest.total) * 100)) + '%';
    dock.querySelector('[data-rest="pause"]').innerHTML = icon(rest.paused ? 'play' : 'pause');
    dock.querySelector('[data-rest="pause"]').setAttribute('aria-label', rest.paused ? 'Resume rest' : 'Pause rest');
    if (over && !rest.buzzed) { rest.buzzed = true; try { store.prefs.vibrate && navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} setTimeout(() => { if (rest && rest.buzzed) { rest = null; tickRest(); } }, 4000); }
  }
  setInterval(() => { tickClock(); tickRest(); }, 250);

  document.getElementById('restDock').addEventListener('click', e => {
    const b = e.target.closest('[data-rest]'); if (!b || !rest) return;
    const a = b.dataset.rest;
    if (a === 'skip') rest = null;
    else if (a === 'pause') {
      if (rest.paused) { rest.end = Date.now() + rest.left * 1000; rest.paused = false; }
      else { rest.left = (rest.end - Date.now()) / 1000; rest.paused = true; }
    } else {
      const d = a === 'plus' ? 15 : -15;
      if (rest.paused) rest.left = Math.max(0, rest.left + d); else rest.end += d * 1000;
      rest.total = Math.max(rest.total + d, 15); rest.buzzed = false;
    }
    save(); tickRest();
  });

  const gymEl = document.getElementById('gym');
  gymEl.addEventListener('click', e => {
    const day = e.target.closest('[data-gday]');
    if (day) { gymSel = Number(day.dataset.gday); renderGym(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    e.stopPropagation();
    const act = b.dataset.act, s = store.sess;
    if (act === 'start') { startSession(Number(b.dataset.rt)); return; }
    if (act === 'close') { store.sess = null; save(); renderGym(); return; }
    if (!s || s.end) return;
    const r = ROUTINE[s.dow], id = r.ex[s.cur], e2 = EX[id], sets = s.sets[id];
    if (act === 'finish') finishSession();
    else if (act === 'goto') s.cur = Number(b.dataset.i);
    else if (act === 'prev') s.cur = Math.max(0, s.cur - 1);
    else if (act === 'next') s.cur = Math.min(r.ex.length - 1, s.cur + 1);
    else if (act === 'addset') { const l = sets[sets.length - 1]; sets.push({ a: l.a, b: l.b, done: false }); }
    else if (act === 'delset') sets.pop();
    else if (act === 'inc' || act === 'dec') {
      const x = sets[Number(b.dataset.s)], f = b.dataset.f, K = KIND[e2.k];
      const step = f === 'a' ? (K.aStep || stepOf(e2)) : K.bStep, dir = act === 'inc' ? 1 : -1;
      const si = Number(b.dataset.s), prevV = si > 0 ? Number(sets[si - 1][f]) || 0 : 0;
      const base = x[f] === '' ? prevV : Number(x[f]) || 0;
      const v = Math.max(0, x[f] === '' && prevV ? base : base + dir * step);
      x[f] = Math.round(v * 10) / 10;
    } else if (act === 'chk') {
      const si = Number(b.dataset.s), x = sets[si];
      x.done = !x.done;
      if (x.done) {
        const allDone = sets.every(z => z.done), lastEx = s.cur === r.ex.length - 1;
        if (!(allDone && lastEx)) startRest(e2.rest);
        if (allDone && !lastEx) s.cur++;
      }
    }
    if (act !== 'finish') { save(); renderGym(); }
  });
  gymEl.addEventListener('input', e => {
    const t = e.target; if (!t.dataset.gf || !store.sess || store.sess.end) return;
    const s = store.sess, id = ROUTINE[s.dow].ex[s.cur];
    s.sets[id][Number(t.dataset.gs)][t.dataset.gf] = t.value === '' ? '' : Number(t.value);
    save();
  });
  gymEl.addEventListener('change', e => {
    const t = e.target; if (!t.dataset.gf || t.dataset.gf !== 'a' || !store.sess || store.sess.end || t.value === '') return;
    const s = store.sess, id = ROUTINE[s.dow].ex[s.cur], sets = s.sets[id];
    let filled = false;
    for (let i = Number(t.dataset.gs) + 1; i < sets.length; i++) if (sets[i].a === '' && !sets[i].done) { sets[i].a = Number(t.value); filled = true; }
    if (filled) { save(); renderGym(); }
  });

  /* ---------- Today: gym teaser ---------- */
  function renderGymTeaser() {
    const now = new Date(), today = now.getDay(), r = ROUTINE[today], s = store.sess;
    const el = document.getElementById('gymTeaser');
    const head = `<div class="card-head"><h2>Today’s workout</h2><a class="btn ghost sm" href="#gym">Open gym ${icon('chev')}</a></div>`;
    if (s && !s.end) {
      const st = sessStats(s);
      el.innerHTML = head + `<div class="teaser"><span class="tile on">${icon('dumbbell')}</span><div class="t"><div class="topic">${ROUTINE[s.dow].name}</div><div class="sub" style="margin:0">In progress · ${st.done} of ${st.total} sets</div></div><a class="btn primary" href="#gym">Resume</a></div>`;
      return;
    }
    if (!r) {
      const next = ORDER.slice(ORDER.indexOf(today) + 1).concat(ORDER).find(d => ROUTINE[d]);
      el.innerHTML = head + `<div class="teaser"><span class="tile">${icon('moon')}</span><div class="t"><div class="topic">Rest day</div><div class="sub" style="margin:0">Ten minutes of mobility. Next is ${DAY[next]}, ${ROUTINE[next].name}</div></div></div>`;
      return;
    }
    const done = store.hist.filter(h => h.d === todayKey() && h.dow === today).pop();
    const blk = SCHED[today].find(b => b.cat === 'gym' || b.cat === 'cardio');
    el.innerHTML = head + `<div class="teaser"><span class="tile on">${icon(r.type === 'cardio' ? 'activity' : 'dumbbell')}</span>
      <div class="t"><div class="topic">${r.name}</div><div class="sub" style="margin:0">${done ? `Done · ${done.mins} min · ${done.sets} sets` : `${r.ex.length} exercises · <span class="mono">${rangeLabel(blk)}</span>`}</div></div>
      ${bodyMap(routineMuscles(r), 64)}</div>
      ${done ? '' : `<div class="actions" style="margin:20px 0 0"><button class="btn primary" data-start-today="${today}">${icon('play')}Start workout</button></div>`}`;
  }

  /* ---------- SAT: week plan ---------- */
  function renderSatWeek(now) {
    const today = now.getDay();
    const rows = ORDER.map(d => {
      const t = SAT[d], blk = SCHED[d].find(b => b.cat === 'sat'), done = isDone(blockKey(d, blk.i, now));
      return `<button class="satw ${d === today ? 'today' : ''}" data-satday="${d}" aria-pressed="${d === selected}">
        <span class="d">${SHORT[d]}</span><span>${t.topic}<small>${t.area}</small></span>
        <span class="st ${done ? 'ok' : ''}">${done ? 'Done' : fmt(blk.s)}</span></button>`;
    }).join('');
    const hours = ORDER.reduce((n, d) => { const b = SCHED[d].find(x => x.cat === 'sat'); return n + (isDone(blockKey(d, b.i, now)) ? 1 : 0); }, 0);
    document.getElementById('satWeek').innerHTML = `<div class="card-head"><h2>This week’s SAT plan</h2><span class="meta">${hours} of 7 h done</span></div>${rows}
      <div class="note">Pick a day to see its lesson and practice links. Check off the SAT block in the schedule when you finish.</div>`;
  }

  /* ---------- Settings ---------- */
  const PREF_DEFAULTS = { unit: 'lb', restTimer: true, vibrate: true };
  store.prefs = Object.assign({}, PREF_DEFAULTS, store.prefs);
  const toKg = x => Math.round(x * 0.45359237 * 2) / 2, toLb = x => Math.round(x / 0.45359237);
  function convertUnits(to) {
    const f = to === 'kg' ? toKg : toLb;
    const loaded = id => EX[id] && ['weight', 'bw', 'carry'].includes(EX[id].k);
    Object.keys(store.logs).forEach(id => { if (loaded(id)) store.logs[id].forEach(x => x.s.forEach(set => { set[0] = f(set[0]); })); });
    store.hist.forEach(h => { if (h.vol) h.vol = to === 'kg' ? Math.round(h.vol * 0.45359237) : Math.round(h.vol / 0.45359237); });
    if (store.sess) Object.keys(store.sess.sets).forEach(id => { if (loaded(id)) store.sess.sets[id].forEach(x => { if (x.a !== '') x.a = f(Number(x.a)); }); });
    store.prefs.unit = to;
  }
  const seg = (key, opts, cur) => `<div class="seg-ctl" role="group">${opts.map(([v, l]) => `<button type="button" data-pref="${key}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;
  const sw = (key, on, label) => `<label class="switch"><input type="checkbox" role="switch" id="pref-${key}" data-pref="${key}" ${on ? 'checked' : ''} aria-label="${label}"><span></span></label>`;
  function renderPrefs() {
    const P = store.prefs;
    document.getElementById('prefs').innerHTML = `
      <section class="card"><h2>Appearance</h2>
        <div class="pref"><div class="lab"><b>Theme</b><small>Dark is the default. System follows your phone or computer</small></div>
          ${seg('theme', [['dark', 'Dark'], ['light', 'Light'], ['system', 'System']], theme)}</div>
      </section>
      <section class="card"><h2>Gym</h2>
        <div class="pref"><div class="lab"><b>Weight units</b><small>Switching converts the weights you have already logged</small></div>
          ${seg('unit', [['lb', 'lb'], ['kg', 'kg']], P.unit)}</div>
        <div class="pref"><div class="lab"><b>Rest timer</b><small>Starts after you check off a set</small></div>${sw('restTimer', P.restTimer, 'Rest timer')}</div>
        <div class="pref"><div class="lab"><b>Vibrate when rest ends</b><small>On phones that support it</small></div>${sw('vibrate', P.vibrate, 'Vibrate when rest ends')}</div>
      </section>
      <section class="card"><h2>Your data</h2>
        <div class="pref"><div class="lab"><b>Saving</b><small id="persistInfo">Everything you check off, log or change saves automatically in this browser</small></div></div>
        <div class="pref stack"><div class="lab"><b>Back up</b><small>Everything is saved in this browser only. Copy a backup to move it to another device or keep it safe</small></div>
          <div class="row-btns"><button class="btn secondary sm" data-data="copy">Copy backup</button></div>
          <textarea id="backupText" placeholder="Paste a backup here to restore it" aria-label="Backup text"></textarea>
          <div class="row-btns"><button class="btn secondary sm" data-data="restore">Restore from the box</button></div>
          <div class="msg" id="dataMsg" role="status"></div></div>
        <div class="pref"><div class="lab"><b>Clear this week</b><small>Removes this week’s check marks from the schedule and scorecard</small></div>
          <button class="btn danger sm" data-data="clearweek">Clear week</button></div>
        <div class="pref"><div class="lab"><b>Erase everything</b><small>Check marks, workout history and settings. This cannot be undone</small></div>
          <button class="btn danger sm" data-data="erase">Erase</button></div>
      </section>
      <section class="card"><h2>About</h2>
        <div class="pref"><div class="lab"><b>Life week planner</b><small>School, SAT, gym, golf and app work around 8 hours of sleep. Design pass with unslop by @heydamir. Workout flow modeled on openGym</small></div>
          <a class="btn secondary sm" href="https://github.com/eigenstarr/life-e" target="_blank" rel="noopener">${icon('github')}GitHub</a></div>
      </section>`;
    persistInfo();
  }
  function persistInfo() {
    const el = document.getElementById('persistInfo'); if (!el) return;
    let ok = true; try { localStorage.setItem('life-planner-probe', '1'); localStorage.removeItem('life-planner-probe'); } catch (e) { ok = false; }
    if (!ok) { el.textContent = 'This browser is blocking storage, so nothing will be kept after you close it. Turn off private browsing to save your progress'; return; }
    try {
      navigator.storage.persisted().then(p => {
        el.textContent = p ? 'Saves automatically and the browser has agreed to keep it' : 'Saves automatically in this browser. On an iPhone, add this page to your Home Screen so Safari never clears it';
      }).catch(() => {});
    } catch (e) {}
  }
  function dataMsg(t, err) { const m = document.getElementById('dataMsg'); if (m) { m.textContent = t; m.classList.toggle('err', !!err); } }
  function arm(btn, label, fn) {
    if (btn.classList.contains('armed')) { fn(); return; }
    const old = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
    setTimeout(() => { btn.classList.remove('armed'); btn.textContent = old; }, 4000);
  }
  const prefsEl = document.getElementById('prefs');
  prefsEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pref === 'theme') { setTheme(b.dataset.v); return; }
    if (b.dataset.pref === 'unit') { if (b.dataset.v !== store.prefs.unit) { convertUnits(b.dataset.v); save(); renderGym(); renderPrefs(); } return; }
    const d = b.dataset.data;
    if (d === 'copy') {
      const text = JSON.stringify({ app: 'life-planner', v: 1, theme, store });
      const box = document.getElementById('backupText');
      const fallback = () => { box.value = text; box.focus(); box.select(); dataMsg('Copy the text in the box and keep it somewhere safe'); };
      try { navigator.clipboard.writeText(text).then(() => dataMsg('Backup copied. Paste it into a note or message to keep it'), fallback); } catch (err) { fallback(); }
    } else if (d === 'restore') {
      try {
        const o = JSON.parse(document.getElementById('backupText').value);
        if (!o || o.app !== 'life-planner' || !o.store || typeof o.store.done !== 'object') throw new Error();
        store = o.store; store.logs = store.logs || {}; store.hist = store.hist || []; store.prefs = Object.assign({}, PREF_DEFAULTS, store.prefs);
        save(); if (o.theme) setTheme(o.theme);
        render(); renderGym(); renderPrefs(); dataMsg('Backup restored');
      } catch (err) { dataMsg('That text is not a backup from this planner. Copy the whole backup and paste it again', true); }
    } else if (d === 'clearweek') {
      arm(b, 'Tap again to clear', () => {
        const now = new Date(), keys = ORDER.map(x => keyOf(dateFor(x, now)) + ':');
        Object.keys(store.done).forEach(k => { if (keys.some(p => k.startsWith(p))) delete store.done[k]; });
        save(); render(); renderPrefs(); dataMsg('This week’s check marks are cleared');
      });
    } else if (d === 'erase') {
      arm(b, 'Tap again to erase', () => {
        store = { done: {}, logs: {}, hist: [], prefs: Object.assign({}, PREF_DEFAULTS) };
        rest = null; save(); setTheme('dark'); render(); renderGym(); renderPrefs(); dataMsg('Everything is erased');
      });
    }
  });
  prefsEl.addEventListener('change', e => {
    const t = e.target; if (t.type !== 'checkbox' || !t.dataset.pref) return;
    store.prefs[t.dataset.pref] = t.checked; save();
    if (t.dataset.pref === 'restTimer' && !t.checked) { rest = null; tickRest(); }
  });

  /* ---------- Pages ---------- */
  const VIEWS = { today: 'Today', gym: 'Gym', sat: 'SAT prep', week: 'Week', preferences: 'Settings' };
  function currentView() { const h = location.hash.slice(1); return VIEWS[h] ? h : 'today'; }
  function route() {
    const v = currentView();
    document.querySelectorAll('.view').forEach(el => { el.hidden = el.dataset.view !== v; });
    document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + v)));
    if (v === 'preferences') renderPrefs();
    renderHeader(new Date());
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const sd = e.target.closest('[data-satday]');
    if (sd) { selected = Number(sd.dataset.satday); render(); return; }
    const st = e.target.closest('[data-start-today]');
    if (st) { startSession(Number(st.dataset.startToday)); location.hash = 'gym'; }
  });

  render();
  renderGym();
  route();
  setInterval(render, 30000);
})();
</script>

</body>
</html>
